services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay-local-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d agent_relay"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  agent-relay:
    image: agent-relay:local
    build: .
    init: true
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay-local-password@postgres:5432/agent_relay
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
